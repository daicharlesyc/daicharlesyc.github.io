<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{page.title}} — Charles Dai</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&display=swap">
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=2">
    </head>
    <body>
        <header>
            <nav>
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/blog.html' | relative_url }}">Blog</a>
                <a href="{{ '/CV.pdf' | relative_url }}">My CV</a>
                <a href="https://github.com/daicharlesyc">Github</a>
            </nav>
        </header>
        <main>
            {{ content }}
        </main>
        <script>
            document.body.classList.add("fonts-loading");

            const showContent = () => {
                document.body.classList.remove("fonts-loading");
            };

            const timeout = setTimeout(showContent, 2000);

            document.fonts.ready.then(() => {
                clearTimeout(timeout);
                showContent();
            });
        </script>
    </body>

</html>
