---
layout: default 
title: Blog 
--- 

<h1>My blog</h1>
<p>You can read some of my thoughts here !</p>
<ul class="post-list">
    {% for post in site.posts %}
        <li>
            <span class="post-date">
                {{ post.date | date: "%B %-d, %Y" }}
            </span>
            <a href="{{ post.url | relative_url }}">
                {{ post.title }}
            </a>
        </li>
    {% endfor %}
</ul>
